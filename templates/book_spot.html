{% extends "base.html" %}

{% block content %}
<style>
    html, body {
        height: 100%;
        overflow-x: hidden;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .main-content-wrapper {
        min-height: calc(100vh - 56px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 15px;
        width: 100%;
        box-sizing: border-box;
        overflow-y: auto;
    }

    .page-title {
        font-size: 2.5rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 2.5rem;
        background: linear-gradient(135deg, #ffffff, #e0e0e0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    @supports not (-webkit-background-clip: text) {
        .page-title {
            color: #ffffff;
        }
    }

    .container.my-4 {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
    }

    .user-form-container {
        max-width: 500px;
        width: 100%;
        padding: 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.3);
        margin: 0 auto;
        position: relative;
        overflow: hidden;
    }

    .user-form-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
        background-size: 300% 300%;
        animation: gradient 3s ease infinite;
    }

    @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .form-group {
        margin-bottom: 20px;
        position: relative;
    }

    .form-label {
        font-weight: 600;
        color: #ffffff;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        display: block;
    }

    .form-control, .form-select {
        width: 100%;
        padding: 12px 18px;
        font-size: 1rem;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.15);
        color: #ffffff;
        transition: all 0.3s ease;
        appearance: none;
    }

    .form-control::placeholder,
    .form-select option {
        color: rgba(255, 255, 255, 0.7);
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #f093fb;
        background: rgba(255, 255, 255, 0.25);
        box-shadow: 0 0 0 0.2rem rgba(240, 147, 251, 0.3);
        transform: translateY(-1px);
        color: #ffffff;
    }

    .form-select option {
        background-color: #764ba2;
        color: #ffffff;
        padding: 8px 15px;
    }

    .form-select option:hover,
    .form-select option:checked {
        background-color: #5a408c;
        color: #ffffff;
    }

    .select-arrow {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #ffffff;
        font-size: 1.2rem;
        pointer-events: none;
    }

    .btn-user-primary {
        background: linear-gradient(135deg, #f093fb, #ff57a6);
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-size: 1.1rem;
        font-weight: 600;
        color: white;
        width: 100%;
        margin-top: 15px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(240, 147, 251, 0.3);
    }

    .btn-user-primary::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        transition: left 0.5s;
    }

    .btn-user-primary:hover::before {
        left: 100%;
    }

    .btn-user-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(240, 147, 251, 0.5);
    }

    .btn-user-primary:active {
        transform: translateY(0);
    }

    @media (max-width: 768px) {
        .page-title {
            font-size: 2rem;
            margin-bottom: 2rem;
        }
        .user-form-container {
            padding: 25px;
            margin: 0 15px;
        }
        .form-control, .form-select {
            padding: 10px 15px;
        }
        .btn-user-primary {
            padding: 10px 25px;
            font-size: 1rem;
        }
    }

    @media (max-width: 576px) {
        .page-title {
            font-size: 1.8rem;
        }
    }
</style>

<div class="main-content-wrapper">
    <h2 class="page-title">Book a Parking Spot</h2>

    <form method="POST" class="user-form-container">
        <div class="mb-3 form-group">
            <label for="lot_id" class="form-label">Select Parking Lot</label>
            <div style="position: relative;">
                <select name="lot_id" id="lot_id" class="form-select" required>
                    <option value="" selected disabled>-- Choose a parking lot --</option>
                    {% for lot in parking_lots %}
                        <option value="{{ lot.id }}">
                            {{ lot.prime_location }} | ₹{{ lot.price_per_hour }}/hr | {{ lot.address }}
                        </option>
                    {% endfor %}
                </select>
                <span class="select-arrow">▼</span>
            </div>
        </div>

        <div class="mb-3 form-group">
            <label for="vehicle_number" class="form-label">Vehicle Number</label>
            <input type="text" name="vehicle_number" class="form-control" placeholder="e.g., UP32AB1234" required>
        </div>

        <button type="submit" class="btn-user-primary">Book Spot</button>
    </form>
</div>
{% endblock %}
