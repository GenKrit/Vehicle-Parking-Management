{% extends "base.html" %}

{% block content %}
<style>
    /* Override base.html container styling */
    .container.my-4 {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
    }
    
    body {
        background: linear-gradient(135deg, #0F111A 0%, #1A1F2B 100%);
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }
    
    .admin-login-wrapper {
        height: calc(100vh - 56px); 
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        width: 100vw;
        /* position: absolute; */
        top: 56px;
        left: 0;
    }
    
    .admin-login-container {
        max-width: 380px;
        width: 100%;
        padding: 35px 35px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.08); 
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1); 
        position: relative;
        overflow: hidden; f
        border: 1px solid rgba(255, 255, 255, 0.15); 
    }
    
    .admin-login-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #00C6FF, #0072FF, #8E2DE2, #4A00E0);
        background-size: 300% 300%;
        animation: gradient 3s ease infinite;
    }
    
    @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    
    .admin-login-header {
        text-align: center;
        margin-bottom: 30px;
    }
    
    .admin-login-title {
        font-size: 1.8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #00C6FF, #0072FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 6px;
    }
    
    .admin-login-subtitle {
        color: #A0AEC0; 
        font-size: 0.95rem;
        font-weight: 400;
    }
    
    .form-group {
        margin-bottom: 20px;
        position: relative;
    }
    
    .form-label {
        font-weight: 600;
        color: #CBD5E0; 
        margin-bottom: 8px;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .form-control {
        border: 2px solid rgba(255, 255, 255, 0.15); 
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 1rem;
        background: rgba(255, 255, 255, 0.05);
        color: #E2E8F0; 
        transition: all 0.3s ease;
        position: relative;
    }
    
    .form-control:focus {
        border-color: #00C6FF; 
        background: rgba(255, 255, 255, 0.1);
        box-shadow: 0 0 0 0.2rem rgba(0, 198, 255, 0.2); 
        transform: translateY(-1px);
    }
    
    .input-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #718096; 
        font-size: 1.1rem;
        pointer-events: none; 
        transition: color 0.3s ease;
    }
    
    .form-control:focus + .input-icon {
        color: #00C6FF; 
    }
    
    .btn-admin-login { 
        background: linear-gradient(135deg, #00C6FF, #0072FF); 
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-size: 1.1rem;
        font-weight: 600;
        color: white;
        width: 100%;
        margin-top: 8px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .btn-admin-login::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
    }
    
    .btn-admin-login:hover::before {
        left: 100%;
    }
    
    .btn-admin-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 198, 255, 0.4); /* Accent shadow on hover */
    }
    
    .btn-admin-login:active {
        transform: translateY(0);
    }
    
    /* Responsive design */
    @media (max-width: 480px) {
        .admin-login-container {
            padding: 30px 25px;
            margin: 15px;
            max-width: 320px;
        }
        
        .admin-login-title {
            font-size: 1.6rem;
        }
        
        .form-control {
            padding: 10px 15px;
        }
        
        .btn-admin-login {
            padding: 10px 25px;
        }
    }
    
    /*sparkle effects */
    .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #00C6FF; 
        border-radius: 50%;
        animation: sparkle 2s linear infinite;
    }
    
    @keyframes sparkle {
        0%, 100% { opacity: 0; transform: scale(0); }
        50% { opacity: 1; transform: scale(1); }
    }
</style>

<div class="admin-login-wrapper">
    <div class="admin-login-container">
        <!-- Decorative sparkles -->
        <div class="sparkle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
        <div class="sparkle" style="top: 30%; right: 15%; animation-delay: 0.5s;"></div>
        <div class="sparkle" style="bottom: 25%; left: 20%; animation-delay: 1s;"></div>
        <div class="sparkle" style="bottom: 40%; right: 10%; animation-delay: 1.5s;"></div>
        
        <div class="admin-login-header">
            <h2 class="admin-login-title">Admin Access</h2>
            <p class="admin-login-subtitle">Secure login for administrators</p>
        </div>

        <form method="POST">
            <div class="form-group">
                <label for="email" class="form-label">Admin Email</label>
                <div style="position: relative;">
                    <input type="email" class="form-control" id="email" name="email" required autocomplete="email" placeholder="Enter admin email">
                    <i class="input-icon">📧</i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password" placeholder="Enter admin password">
                    <i class="input-icon">🔑</i>
                </div>
            </div>

            <button type="submit" class="btn-admin-login">
                Login as Admin
            </button>
        </form>
    </div>
</div>
{% endblock %}
