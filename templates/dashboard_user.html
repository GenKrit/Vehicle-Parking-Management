{% extends "base.html" %}

{% block content %}
<style>

    body {
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow-x: hidden; 
        margin: 0;
        padding: 0;
        min-height: 100vh; 
        display: flex; 
        flex-direction: column;
    }

    main.dashboard {
        flex-grow: 1; 
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; 
        padding: 2rem 1rem; 
        box-sizing: border-box; 
        width: 100%; 
    }


    .dash-title {
        font-size: 2.4rem;
        font-weight: 700;
        background: linear-gradient(135deg, #fff, #e0e0e0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2rem;
        text-align: center;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); 
        z-index: 2; 
        position: relative; 
    }


    @supports not (-webkit-background-clip: text) {
        .dash-title {
            color: #ffffff; 
        }
    }

    .dashboard-box {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 2rem;
        max-width: 820px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.25);
        margin: 0 auto;
        position: relative; 
        overflow: hidden;   
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        z-index: 1; 
    }

    .dashboard-box::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
       
        background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #f5576c);
        background-size: 300% 100%; 
        animation: gradientMove 3s ease infinite;
        z-index: 1; 
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .card-link {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 12px;
        padding: 1.5rem;
        text-align: center;
        color: #fff;
        text-decoration: none;
        transition: all 0.3s ease; 
        display: flex; 
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%; 
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); 
        border: 1px solid rgba(255, 255, 255, 0.2); 
    }

    .card-link:hover {
        background: rgba(255, 255, 255, 0.25);
        transform: translateY(-5px); 
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); 
        color: #fff; 
    }

    .card-link span.icon {
        font-size: 2.2rem;
        display: block;
        margin-bottom: 10px;
        color: #f093fb; /* Accent color for icons */
        transition: color 0.3s ease;
    }

    .card-link:hover span.icon {
        color: #ff57a6; /* Brighter accent on hover */
    }

    .card-link.logout {
        background: rgba(220, 53, 69, 0.25); /* Reddish transparent for logout */
        border: 1px solid rgba(220, 53, 69, 0.3);
    }
    .card-link.logout:hover {
        background: rgba(220, 53, 69, 0.35);
        box-shadow: 0 10px 25px rgba(220, 53, 69, 0.2);
    }
    .card-link.logout span.icon {
        color: #ff4d4d; /* Brighter red for logout icon */
    }
    .card-link.logout:hover span.icon {
        color: #ff8080;
    }


    /* Small devices (phones, less than 768px) */
    @media (max-width: 768px) { 
        .dash-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
        .dashboard-box {
            padding: 1.5rem;
            margin: 0 15px; 
        }
        .card-link {
            padding: 1.2rem;
            font-size: 0.95rem; 
        }
        .card-link span.icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        
        .row > .col-6,
        .row > .col-md-6 {
            width: 100%;
            flex: 0 0 100%;
            max-width: 100%;
        }
    }

   
    @media (max-width: 575.98px) { 
        .dash-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
        .dashboard-box {
            padding: 1rem;
        }
        .card-link {
            padding: 1rem;
            font-size: 0.9rem;
        }
        .card-link span.icon {
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
    }

</style>

<main class="dashboard">
    <h2 class="dash-title">Welcome to Your Dashboard</h2>

    <section class="dashboard-box">
        <div class="row g-3">
            <div class="col-6 col-md-6">
                <a href="{{ url_for('user_bp.book_parking') }}" class="card-link">
                    <span class="icon">🅿️</span>
                    Book Parking
                </a>
            </div>
            <div class="col-6 col-md-6">
                <a href="{{ url_for('user_bp.release_spot') }}" class="card-link">
                    <span class="icon">🔑</span>
                    Release Spot
                </a>
            </div>
            <div class="col-6 col-md-6">
                <a href="{{ url_for('user_bp.booking_history') }}" class="card-link">
                    <span class="icon">📜</span>
                    Booking History
                </a>
            </div>
            <div class="col-6 col-md-6">
                <a href="{{ url_for('user_bp.logout') }}" class="card-link logout">
                    <span class="icon">🚪</span>
                    Logout
                </a>
            </div>
        </div>
    </section>
</main>
{% endblock %}
