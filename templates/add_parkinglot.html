{% extends "base.html" %}

{% block content %}
<style>

    body {
        background: linear-gradient(135deg, #0F111A, #1A1F2B);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
    }

    main.lot-form-section {
        min-height: calc(100vh - 56px);
        padding: 2rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }


    .lot-form-title {
        font-size: 2.3rem;
        font-weight: 700;
        background: linear-gradient(135deg, #00C6FF, #0072FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2rem;
        text-align: center;
        text-shadow: 0 0 10px rgba(0, 198, 255, 0.2);
    }


    .form-box {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 2rem;
        max-width: 500px;
        width: 100%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
    }
    
    .form-box::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, #00C6FF, #0072FF, #8E2DE2, #4A00E0);
        background-size: 300% 100%;
        animation: gradientMove 3s ease infinite;
    }
    
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }


    .form-box label {
        font-weight: 600;
        font-size: 0.9rem;
        color: #CBD5E0;
        text-transform: uppercase;
        margin-bottom: 6px;
    }
    
    .form-box .form-group {
        margin-bottom: 1.2rem;
    }

    .form-box input,
    .form-box textarea {
        border: 1.5px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: #E2E8F0;
        padding: 10px 14px;
        border-radius: 10px;
        width: 100%;
        font-size: 1rem;
        transition: all 0.3s ease;
    }
    
    .form-box input:focus,
    .form-box textarea:focus {
        border-color: #00C6FF;
        outline: none;
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 0.2rem rgba(0, 198, 255, 0.2);
    }
    
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 1rem;
    }
    
    .form-actions .btn {
        padding: 10px 22px;
        border-radius: 10px;
        font-weight: 600;
        border: none;
        color: white;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        text-decoration: none;
    }

    .form-actions .btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
    }
    
    .form-actions .btn:hover::before {
        left: 100%;
    }
    
    .form-actions .btn:hover {
        transform: translateY(-2px);
    }
    
    .form-actions .btn-cancel {
        background: #374151;
    }

    .form-actions .btn-cancel:hover {
        background: #4B5563;
    }
    
    .form-actions .btn-submit {
        background: linear-gradient(135deg, #00C6FF, #0072FF);
        box-shadow: 0 4px 15px rgba(0, 198, 255, 0.3);
    }
    
    .form-actions .btn-submit:hover {
        box-shadow: 0 8px 25px rgba(0, 198, 255, 0.4);
    }


    @media (max-width: 576px) {
        .lot-form-title {
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
        .form-box {
            padding: 1.5rem;
        }
        .form-actions {
            flex-direction: column;
        }
        .form-actions .btn {
            width: 100%;
            padding: 12px 22px;
        }
    }
</style>

<main class="lot-form-section">
    <h2 class="lot-form-title">Add Parking Lot</h2>

    <form method="POST" class="form-box">
        <div class="form-group">
            <label for="location">Prime Location Name</label>
            <input type="text" id="location" name="location" required placeholder="e.g., City Center Mall">
        </div>

        <div class="form-group">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="2" required placeholder="Complete address"></textarea>
        </div>

        <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" pattern="\d{6}" required placeholder="e.g., 123456">
        </div>

        <div class="form-group">
            <label for="price_per_hour">Price per Hour (₹)</label>
            <input type="number" step="0.1" id="price_per_hour" name="price_per_hour" required placeholder="e.g., 50.00">
        </div>

        <div class="form-group">
            <label for="total_spots">Number of Spots</label>
            <input type="number" id="total_spots" name="total_spots" required min="1" placeholder="e.g., 100">
        </div>

        <div class="form-actions mt-3">
            <a href="{{ url_for('admin_bp.admin_dashboard') }}" class="btn btn-cancel">Cancel</a>
            <button type="submit" class="btn btn-submit">Add Lot</button>
        </div>
    </form>
</main>
{% endblock %}
